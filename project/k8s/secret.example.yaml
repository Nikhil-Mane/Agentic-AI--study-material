# DO NOT commit real values. Prefer: External Secrets Operator / Secrets Store CSI driver pulling from
# AWS Secrets Manager / GCP Secret Manager / Azure Key Vault / HashiCorp Vault. Quick start only:
#   kubectl create secret generic supportops-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=API_KEYS='{"prod-key-abc":"C-1"}'
apiVersion: v1
kind: Secret
metadata:
  name: supportops-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
  API_KEYS: '{"REPLACE_KEY":"C-1"}'
